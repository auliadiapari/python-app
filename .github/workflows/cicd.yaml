name: CICD

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      
      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: auliardd/python-app:${{ env.COMMIT_ID }}
      
      

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      
      - uses: actions/checkout@v3

      - name: Modify values file
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.COMMIT_ID }}
          pip install yq
          yq -Yi '.image.tag = "${{ needs.ci.outputs.COMMIT_ID }}"' charts/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.COMMIT_ID }}"
        run: |

      - name: Install ArgoCD
        shell: bash
        run: |
          # Download the latest version of ArgoCD CLI from my ownlocalserver, because the official download link is not accessible from my self-hosted runner, and this step uses self-hosted
          # Use official link if you have access if you have access to the official ArgoCD download link.
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: ArgoCD Sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app \